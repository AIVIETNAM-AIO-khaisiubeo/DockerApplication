# File này chạy cả 4 phần cùng lúc. Chỉ dùng khi nhóm muốn thử toàn bộ ứng dụng.
# Nếu đang làm một module riêng, hãy dùng docker-compose.p1.yml, p2, p3 hoặc p4.
# Khi chạy "docker compose up", Docker Compose tự gộp docker-compose.override.yml để chia sẻ code
# từ laptop vào container và tự tải lại khi code thay đổi. Xem docs/DOCKER_BASICS.md để hiểu các từ này.
name: medtriage

services:
  # P1: giao diện mà người dùng mở trong trình duyệt.
  ui:
    build: ./services/01-ui
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      VISION_URL: http://vision:8000
      LLM_URL: http://llm:8000
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-medtriage}
      POSTGRES_USER: ${POSTGRES_USER:-medtriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ./data:/data:ro
    networks: [frontend, backend] # UI cần gọi API và database nên kết nối cả hai mạng.
    depends_on:
      db:     {condition: service_healthy}
      vision: {condition: service_healthy}
      llm:    {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # P2: nhận file ảnh và trả về kết quả Vision.
  vision:
    build: ./services/02-vision
    environment:
      MODEL_MODE: ${MODEL_MODE:-mock}      # mock | real
      MODEL_DIR: /models
    volumes:
      - vision_models:/models              # vùng giữ weights/cache Vision qua các lần tạo container
    networks: [backend] # service nội bộ, không mở cổng trực tiếp ra máy host.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # P3: nhận triệu chứng + kết quả Vision và tạo ghi chú SOAP.
  llm:
    build: ./services/03-llm
    environment:
      LLM_MODE: ${LLM_MODE:-mock}          # mock | real
      MODEL_DIR: /models
      ENABLE_DEBUG: ${ENABLE_DEBUG:-0}     # =1 mở /debug/* phục vụ Audit 3 (KHÔNG bật khi demo)
    volumes:
      - llm_models:/models                 # vùng giữ weights/cache LLM qua các lần tạo container
    networks: [backend]
    deploy:
      resources:
        limits:                            # TODO(P3): chỉnh theo model thật, dùng cho Audit 3
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # P4: lưu lịch sử các ca thử nghiệm.
  db:
    build: ./services/04-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medtriage}
      POSTGRES_USER: ${POSTGRES_USER:-medtriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - db_data:/var/lib/postgresql/data   # vùng giữ database qua các lần tạo container
    networks: [backend]
    # Việc P4 cần thử: dùng tài khoản ít quyền hơn khi chạy DB và kiểm tra lại init.sql/volume.
    # Không mở cổng 5432 ra máy host trong stack tích hợp.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  frontend: {}     # mạng phía người dùng; chỉ UI mở cổng ra máy host
  backend: {}      # mạng riêng để các container gọi nhau bằng tên service

volumes:
  vision_models:
  llm_models:
  db_data:
