# Chế độ DEV — tự động gộp khi chạy `docker compose up` (audit KHÔNG dùng file này).
# Bind mount code UI để sửa app.py là Streamlit tự reload, không cần build lại.
services:
  ui:
    volumes:
      - ./services/01-ui:/app
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.runOnSave=true
      - --server.fileWatcherType=poll   # cần cho bind mount trên Windows/macOS
